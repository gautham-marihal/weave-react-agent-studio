<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/icon.ico" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#72308F" />
  <title>Weave Studio Web Console</title>
  <script>
    // Light or dark, the design style and its colour, applied before the first paint so nothing flashes.
    // The same choices as src/contexts/ThemeContext.tsx; the list of styles matches src/models/styles.ts.
    (function () {
      var root = document.documentElement;
      try {
        var t = localStorage.getItem('weave_theme');
        if (t === 'system') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        t = t === 'dark' ? 'dark' : 'light';
        root.setAttribute('data-theme', t);
        if (t === 'dark') root.classList.add('dark');
        var s = localStorage.getItem('weave_style');
        s = ['studio', 'simple', 'professional', 'calm', 'premium', 'futuristic', 'vibrant'].indexOf(s) >= 0 ? s : 'studio';
        root.setAttribute('data-style', s);
        var a = localStorage.getItem('weave_accent_' + s);
        if (a) root.setAttribute('data-accent', a);
      } catch (e) {
        root.setAttribute('data-theme', 'light');
        root.setAttribute('data-style', 'studio');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
