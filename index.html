    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:type" content="website" />

    <meta property="og:description" content="Weave Agent Studio: build, test, publish and monitor voice and chat AI agents." />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23111113%27/%3E%3Cg stroke=%27white%27 stroke-width=%273.4%27 stroke-linecap=%27round%27%3E%3Cpath d=%27M16 8.8v14.4M10.6 10.6l10.8 10.8M21.4 10.6 10.6 21.4%27/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>Weave · Build, test and run AI agents</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('weave_theme');
          document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
          var s = localStorage.getItem('weave_style');
          s = ['simple', 'professional', 'calm', 'premium', 'futuristic', 'vibrant'].indexOf(s) >= 0 ? s : 'simple';
          document.documentElement.dataset.style = s;
          var a = localStorage.getItem('weave_accent_' + s);
          if (a) document.documentElement.dataset.accent = a;
        } catch (_) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.style = 'simple';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
