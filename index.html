<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Weave Agent Studio: build, test, publish and monitor voice and chat AI agents." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Weave" />
    <meta property="og:title" content="Weave · Build, test and run AI agents" />
    <meta property="og:description" content="Weave Agent Studio: build, test, publish and monitor voice and chat AI agents." />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/weave-studio.png" />
    <title>Weave · Build, test and run AI agents</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('weave_theme');
          document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
          var s = localStorage.getItem('weave_style');
          s = ['studio', 'simple', 'professional', 'calm', 'premium', 'futuristic', 'vibrant'].indexOf(s) >= 0 ? s : 'studio';
          document.documentElement.dataset.style = s;
          var a = localStorage.getItem('weave_accent_' + s);
          if (a) document.documentElement.dataset.accent = a;
        } catch (_) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.style = 'studio';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
