# What a SonarQube server (or SonarQube Cloud) analyses when `sonar-scanner` is run in this folder. The server's address and the token come from the
# environment (SONAR_HOST_URL, SONAR_TOKEN), never from this file. Day to day the same SonarJS rules run locally, in `npm run lint` (eslint.config.js).
sonar.projectKey=weave-agent-studio
sonar.projectName=Weave Agent Studio
sonar.sourceEncoding=UTF-8

# the app; its tests and browser tests are tests
sonar.sources=src,llmRoute.js,vite.config.js
sonar.tests=tests,e2e
sonar.exclusions=src/api/agentConfig.d.ts,**/*.css
sonar.test.exclusions=tests/fixtures/**

# ESLint's own findings, when a report is written first (npx eslint . -f json -o eslint-report.json)
sonar.eslint.reportPaths=eslint-report.json
